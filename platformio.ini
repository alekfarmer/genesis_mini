; Genesis Mini firmware. Build through the Makefile only (see README.md).
;
; Each project is one [env:<name>] extending [base], with its code in
; src/<name>/. Shared code lives in lib/, pins in include/pins.h.

[platformio]
default_envs = hello

; Settings shared by every firmware project.
[base]
; pioarduino platform 55.03.36-1 = Arduino-ESP32 core 3.3.6 on ESP-IDF 5.5.2,
; the core version the Axiometa board package is built against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = genesis_mini
; The Genesis Mini variant is not in the stock core; it is vendored here.
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200
; Warnings are errors for our own sources (src/); each lib/ library sets the
; same flags in its library.json. Framework code is left alone.
build_src_flags = -Wall -Wextra -Werror

; ---- Projects -------------------------------------------------------------

[env:hello]
extends = base
build_src_filter = +<hello/>

; Library versions are the ones the Axiometa catalog lists for each module.
[env:kit_demo]
extends = base
build_src_filter = +<kit_demo/>
lib_deps =
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@1.10.3
    mathertel/RotaryEncoder@1.5.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    ; Pulled in by Adafruit GFX; pinned to the version that resolved.
    adafruit/Adafruit BusIO@1.17.4
; Declared by the ST7735 library for features we don't use. Ignored so they
; are never compiled (the AVR "SD" library must not shadow the core's SD).
lib_ignore =
    SD
    Adafruit seesaw Library

; The game menu: snake, shooter, beat maker, blockfall (src/arcade/apps.cpp).
[env:arcade]
extends = base
build_src_filter = +<arcade/>
lib_deps =
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@1.10.3
    mathertel/RotaryEncoder@1.5.3
    adafruit/Adafruit BusIO@1.17.4
lib_ignore =
    SD
    Adafruit seesaw Library

; The arcade with the Tactile LED Button in port 3 instead of the DHT11
; (include/board_configs/led_button_port3.h). Adds the games that need the
; button, and keeps their code compiling on every `make verify`.
[env:arcade_led_button]
extends = env:arcade
build_flags = '-DBOARD_CONFIG_FILE="board_configs/led_button_port3.h"'

; ---- Host unit tests (make test) -----------------------------------------

[env:native]
platform = platformio/native@1.2.1
build_flags = -std=c++17 -Wall -Wextra -Werror
test_build_src = no
